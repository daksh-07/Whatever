<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><title>SYDNEY: UNDERWORLD</title></head><body style="margin:0;background:#05070a;color:white;font:14px system-ui;text-align:center"><div style="position:fixed;inset:0;display:grid;place-items:center">Loading Sydney…</div><script>
(async()=>{
const raw='https://raw.githubusercontent.com/daksh-07/Whatever/d5fad2aaa8a6191b3fa94c3138776ea64133d5cf/index.html';
try{
 let s=await fetch(raw,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('fetch '+r.status);return r.text()});
 s=s.replace('id="enter">ENTER SYDNEY →','id="enter" onclick="window.__startSydney()">ENTER SYDNEY →');
 s=s.replace("let play=false,paused=false,last=0,keys={},touch={u:0,d:0,l:0,r:0},toastT=0;", "let play=false,paused=false,last=0,keys={},touch={u:0,d:0,l:0,r:0},toastT=0;window.__started=false;window.__startSydney=()=>{window.__started=true;play=true;paused=false;last=performance.now();const e=document.getElementById('start');if(e)e.classList.add('hide');try{objective('Investigate the first lead in Rooty Hill.','The city is open. Walk, drive, investigate and recruit.');toast('Welcome to Sydney. Build something bigger.');save();hud()}catch(err){console.error(err)}};");
 s=s.replace('function move(dt){if(!play||paused)return;', 'function move(dt){if((!play&&!window.__started)||paused)return;');
 s=s.replace('function sim(dt){if(!play||paused)return;', 'function sim(dt){if((!play&&!window.__started)||paused)return;');
 s=s.replace("$('enter').onclick=()=>{$('start').classList.add('hide');play=true;", "$('enter').onclick=window.__startSydney;window.addEventListener('pointerup',e=>{if(e.target&&e.target.id==='enter')window.__startSydney()},{passive:true});$('enter').ontouchend=window.__startSydney;");
 document.open();document.write(s);document.close();
}catch(e){document.body.innerHTML='<div style="padding:40px;font:16px system-ui">Sydney failed to load. Please refresh.<br><small>'+String(e)+'</small></div>';console.error(e)}
})();
</script></body></html>
