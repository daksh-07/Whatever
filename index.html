<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07070b"><title>WHATEVER. — Browser Game Universe</title><style>:root{--bg:#07070b;--p:#111118;--l:#292934;--t:#f7f7fb;--m:#9999aa;--a:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#29154d,#08080d 45%,#07070b);color:var(--t);font:15px system-ui}.nav{position:sticky;top:0;background:#08080eee;border-bottom:1px solid #fff1;z-index:5}.navin{max-width:1200px;margin:auto;padding:12px 18px;display:flex;gap:15px;align-items:center}.logo{background:none;border:0;color:#fff;font-size:24px;font-weight:1000}.logo i{color:var(--a)}.links{display:flex;gap:3px;flex:1}.links button,.mobile button{background:none;border:0;color:#bbb;padding:8px;border-radius:8px}.links button:hover,.mobile button:hover{background:#fff1;color:#fff}.pill,.btn{background:#16161f;color:#fff;border:1px solid var(--l);border-radius:10px;padding:9px 12px}.pill{border-radius:99px;font-size:12px}.btn{font-weight:800;cursor:pointer}.primary{background:#7c3aed;border-color:#a78bfa66}.menu{display:none}.mobile{display:none}.page{max-width:1200px;margin:auto;padding:24px 18px 70px}.hero{min-height:400px;border:1px solid #fff1;border-radius:28px;padding:55px;display:flex;align-items:end;background:linear-gradient(135deg,#181128,#0d131a)}.hero h1{font-size:clamp(55px,10vw,105px);line-height:.85;letter-spacing:-6px;margin:12px 0}.hero p{font-size:22px;color:#ccc}.k{color:#b9a9ff;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.row{display:flex;gap:8px;flex-wrap:wrap}.section{margin-top:32px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.muted{color:var(--m)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#111118;border:1px solid var(--l);border-radius:17px;padding:13px;min-height:205px;display:flex;flex-direction:column}.thumb{height:95px;border-radius:11px;background:linear-gradient(135deg,#29203d,#12121a);padding:10px;display:flex;align-items:end;font-weight:900;font-size:19px}.card p{color:var(--m);font-size:12px;flex:1}.panel{background:#101017;border:1px solid var(--l);border-radius:17px;padding:18px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.game{min-height:500px}.gamehead{display:flex;justify-content:space-between;align-items:center}.board{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:18px auto;max-width:700px}.cell{aspect-ratio:1;background:#181820;border:1px solid #292934;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px}.chosen{box-shadow:inset 0 0 0 3px #fff}.city{height:440px;background:#101a22;border:1px solid var(--l);border-radius:14px;position:relative;overflow:hidden}.road{position:absolute;background:#28313a}.building{position:absolute;background:#1b2934;border:1px solid #394956}.you{position:absolute;width:16px;height:16px;border-radius:50%;background:#a78bfa;box-shadow:0 0 15px #a78bfa}.platform{position:absolute;height:12px;background:#8b5cf6;border-radius:6px}.hazard{position:absolute;background:#fb7185}.finish{position:absolute;background:#34d399}.person{position:absolute;width:24px;height:32px;background:#fff;border-radius:6px}.choices{display:grid;gap:8px}.choice{background:#171720;border:1px solid var(--l);border-radius:11px;padding:13px;text-align:left;color:#fff;cursor:pointer}.choice span{display:block;color:var(--m);font-size:12px}.project,.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.leader{display:grid;grid-template-columns:40px 1fr 100px;padding:10px;border-bottom:1px solid #22222c}.footer{margin-top:55px;padding-top:25px;border-top:1px solid #fff1;color:var(--m);display:flex;justify-content:space-between}.footer b{color:#fff}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.project,.ach{grid-template-columns:1fr 1fr}}@media(max-width:650px){.links{display:none}.menu{display:block;margin-left:auto}.mobile.open{display:flex;flex-direction:column;background:#09090f;padding:10px 18px;border-top:1px solid var(--l)}.cards,.project,.ach{grid-template-columns:1fr}.hero{padding:30px;min-height:450px}.hero h1{letter-spacing:-3px}.footer{flex-direction:column}}
</style></head><body><div id="app"><header class="nav"><div class="navin"><button class="logo">WHATEVER<i>●</i></button><nav class="links"><button>HOME</button><button>GAMES</button><button>OPEN WORLD</button><button>SIMULATORS</button><button>PROJECTS</button><button>LEADERBOARD</button><button>ACHIEVEMENTS</button></nav><span class="pill">🪙 <b id="coins">0</b> · LVL <b id="lvl">1</b></span><button class="btn menu">☰</button></div><div class="mobile"><button>HOME</button><button>GAMES</button><button>OPEN WORLD</button><button>SIMULATORS</button><button>PROJECTS</button></div></header><main class="page"><section class="hero"><div><div class="k">Browser Game Universe</div><h1>WHATEVER.</h1><p>One website. Hundreds of bad decisions.<br><span class="muted">Play. Build. Fail. Start again.</span></p><button class="btn primary" onclick="gamesPage()">PLAY NOW →</button></div></section><section class="section"><div class="head"><h2>🔥 Featured Games</h2><span class="muted">Playable now</span></div><div id="home" class="cards"></div></section><footer class="footer"><div><b>WHATEVER.</b><br>Play. Build. Fail. Start again.</div><div>Made by Daksh<br>© 2026 Daksh. All rights reserved.</div></footer></main></div><script>(()=>{const $=id=>document.getElementById(id),A=$('app');const G=[['chaos','🎲 CHAOS LADDER','ARCADE','Roll through 100 spaces.'],['rage','💀 WHY DID I DO THIS?','HARD','Original rage platformer.'],['detail','🚘 DETAILING TYCOON','SIMULATION','Build a detailing empire.'],['business','💼 WHATEVER: BUSINESS','BUSINESS','Run a business for 30 days.'],['city','🌆 WHATEVER CITY','OPEN WORLD','Explore districts and earn money.'],['startup','📈 STARTUP OR DIE','TYCOON','Grow MRR and survive runway.'],['dealer','🏎️ CAR DEALERSHIP TYCOON','TYCOON','Flip fictional cars.'],['restaurant','🍜 RESTAURANT TYCOON','TYCOON','Grow a food business.'],['delivery','🚚 DELIVERY BUSINESS','STRATEGY','Manage routes and vehicles.'],['survival','🌲 SURVIVAL','SURVIVAL','Collect and survive.'],['racing','🏁 WHATEVER RACING','RACING','Arcade time trial.']];let s={level:1,xp:0,coins:0,wins:0,played:0};try{s=Object.assign(s,JSON.parse(localStorage.getItem('whatever-player')||'{}'))}catch(e){}const save=()=>{try{localStorage.setItem('whatever-player',JSON.stringify(s))}catch(e){}};const gain=n=>{s.xp+=n;s.coins+=Math.max(1,Math.floor(n/4));while(s.xp>=s.level*100){s.xp-=s.level*100;s.level++}save();sync()};function sync(){if($('coins'))$('coins').textContent=s.coins;if($('lvl'))$('lvl').textContent=s.level}function card(g){return '<article class="card"><div class="thumb">'+g[1]+'</div><div class="muted">'+g[2]+'</div><p>'+g[3]+'</p><button class="btn" onclick="play(\''+g[0]+'\')">PLAY →</button></article>'}function nav(){return '<header class="nav"><div class="navin"><button class="logo" onclick="home()">WHATEVER<i>●</i></button><nav class="links"><button onclick="home()">HOME</button><button onclick="gamesPage()">GAMES</button><button onclick="city()">OPEN WORLD</button><button onclick="simPage()">SIMULATORS</button><button onclick="projects()">PROJECTS</button><button onclick="leader()">LEADERBOARD</button><button onclick="ach()">ACHIEVEMENTS</button></nav><span class="pill">🪙 '+s.coins+' · LVL '+s.level+'</span><button class="btn menu" onclick="document.querySelector(\'.mobile\').classList.toggle(\'open\')">☰</button></div></header>'}function shell(b){A.innerHTML=nav()+'<main class="page">'+b+'<footer class="footer"><div><b>WHATEVER.</b><br>Play. Build. Fail. Start again.</div><div>Made by Daksh<br>© 2026 Daksh. All rights reserved.</div></footer></main>'}function home(){shell('<section class="hero"><div><div class="k">Browser Game Universe</div><h1>WHATEVER.</h1><p>One website. Hundreds of bad decisions.<br><span class="muted">Play. Build. Fail. Start again.</span></p><button class="btn primary" onclick="gamesPage()">PLAY NOW →</button></div></section><section class="section"><div class="head"><h2>🔥 Featured Games</h2></div><div class="cards">'+G.slice(0,4).map(card).join('')+'</div></section>')}function gamesPage(){shell('<div class="head"><h2>All Games</h2><input id="search" placeholder="Search games…" style="background:#101017;border:1px solid var(--l);color:white;border-radius:10px;padding:10px;max-width:340px;width:100%"></div><div id="games" class="cards">'+G.map(card).join('')+'</div><section class="section"><div class="head"><h2>🔒 Coming Soon</h2></div><div class="cards">'+['CITY BUILDER','CRYPTO TYCOON','AIRLINE TYCOON','FARMING SIMULATOR','NIGHTCLUB TYCOON','SPACE COLONY','HOTEL TYCOON','ISLAND SURVIVAL'].map(x=>'<article class="card"><div class="thumb">🔒 '+x+'</div><p class="muted">Coming soon.</p><button class="btn" disabled>LOCKED</button></article>').join('')+'</div></section>');$('search').oninput=e=>{$('games').innerHTML=G.filter(g=>g.join(' ').toLowerCase().includes(e.target.value.toLowerCase())).map(card).join('')}}function game(title,sub,b){shell('<div class="gamehead"><div><h2>'+title+'</h2><div class="muted">'+sub+'</div></div><button class="btn" onclick="gamesPage()">← GAMES</button></div><div class="two"><section class="panel game">'+b+'</section><aside class="panel"><div class="k">Player</div><h3>PLAYER</h3><p class="muted">Level '+s.level+' · '+s.coins+' coins</p></aside></div>')}function chaos(){let p=0;game('🎲 CHAOS LADDER','100 spaces · traps · boosts','<div id="board" class="board"></div><div class="row"><button id="roll" class="btn primary">ROLL DICE 🎲</button><button class="btn" onclick="chaos()">RESTART</button></div><p id="msg" class="muted">Reach 100.</p>');function draw(){let b=$('board');b.innerHTML='';for(let n=100;n;n--){let c=document.createElement('div');c.className='cell'+(n===p?' chosen':'');c.textContent=n;b.appendChild(c)}}$('roll').onclick=()=>{p=Math.min(100,p+1+Math.floor(Math.random()*6));if(Math.random()<.2)p=Math.max(0,p-5);draw();$('msg').textContent='Space '+p;if(p===100){s.wins++;gain(80);$('roll').disabled=true;$('msg').textContent='🏆 YOU WIN'}};draw()}function city(){let x=48,y=58,m=250,j=0;game('🌆 WHATEVER CITY','Top-down mini open world','<div class="city"><div class="road" style="left:0;right:0;top:45%;height:60px"></div><div class="road" style="top:0;bottom:0;left:45%;width:60px"></div><div class="building" style="left:5%;top:8%;width:30%;height:22%"></div><div class="building" style="left:62%;top:8%;width:28%;height:22%"></div><div class="building" style="left:5%;top:70%;width:30%;height:22%"></div><div class="building" style="left:62%;top:70%;width:28%;height:22%"></div><div class="you" id="you"></div></div><div class="touch row" style="justify-content:center"><button class="btn" onclick="mv(0,-3)">▲</button><button class="btn" onclick="mv(-3,0)">◀</button><button class="btn" onclick="mv(0,3)">▼</button><button class="btn" onclick="mv(3,0)">▶</button></div><div class="panel"><button class="btn primary" id="job">CITY JOB +$100</button><span class="pill" id="money">$250</span></div>');function r(){$('you').style.left=x+'%';$('you').style.top=y+'%'}window.mv=(a,b)=>{x=Math.max(2,Math.min(94,x+a));y=Math.max(2,Math.min(94,y+b));r()};$('job').onclick=()=>{m+=100;j++;gain(5);$('money').textContent='$'+m;if(j===5){s.wins++;gain(20)}};r()}function rage(){let x=20,y=300,v=0,L=0,R=0,dead=0,done=0;game('💀 WHY DID I DO THIS?','Original rage platformer','<div class="canvas"><div class="platform" style="left:0;top:340px;width:100%"></div><div class="platform" style="left:160px;top:275px;width:110px"></div><div class="platform" style="left:350px;top:215px;width:100px"></div><div class="finish" style="left:650px;top:115px;width:30px;height:30px"></div><div class="hazard" style="left:280px;top:325px;width:55px;height:15px"></div><div class="hazard" style="left:450px;top:200px;width:55px;height:15px"></div><div id="p" class="person"></div></div><div class="touch row" style="justify-content:center"><button class="btn" onpointerdown="L=1" onpointerup="L=0">◀</button><button class="btn" onclick="v=-11">▲</button><button class="btn" onpointerdown="R=1" onpointerup="R=0">▶</button></div><p id="rm" class="muted">Deaths: 0</p>');function tick(){if(done)return;v+=.7;x+=(R?3:0)-(L?3:0);y+=v;if(y>306){y=306;v=0}if(x<0)x=0;if(x>675)x=675;$('p').style.left=x+'px';$('p').style.top=y+'px';if(x>270&&x<350&&y>290||x>440&&x<520&&y>180){dead++;x=20;y=300;v=0;$('rm').textContent='Deaths: '+dead}if(x>620&&y<160){done=1;s.wins++;gain(90);$('rm').textContent='🏆 YOU SURVIVED — '+dead+' deaths'}}setInterval(tick,30)}function sim(title,start){let money=start,day=1,rep=60;game(title,'Turn-based simulator','<div class="statgrid"><div class="stat"><small>Cash</small><strong id="cash">$'+start+'</strong></div><div class="stat"><small>Day</small><strong id="day">1</strong></div><div class="stat"><small>Rep</small><strong id="rep">60</strong></div></div><div class="choices"><button class="choice" id="a"><b>Go aggressive</b><span>Big upside, big risk.</span></button><button class="choice" id="b"><b>Balanced</b><span>Steady growth.</span></button><button class="choice" id="c"><b>Play safe</b><span>Lower risk.</span></button></div><p id="out" class="muted">Make a decision.</p>');function act(k){let g=k===0?Math.random()*1600-500:k===1?Math.random()*900+100:Math.random()*500+30;money+=g-250;rep=Math.max(0,Math.min(100,rep+(Math.random()>.4?2:-3)));day++;$('cash').textContent='$'+Math.max(0,Math.round(money));$('day').textContent=day;$('rep').textContent=rep;$('out').textContent='Net change $'+Math.round(g-250);if(day>30||money<=0){s.wins++;gain(80);$('out').textContent=money>0?'🏆 30 DAYS COMPLETE':'💀 BROKE';document.querySelectorAll('.choice').forEach(x=>x.disabled=true)}}$('a').onclick=()=>act(0);$('b').onclick=()=>act(1);$('c').onclick=()=>act(2)}function play(id){s.played++;save();if(id==='chaos')chaos();else if(id==='rage')rage();else if(id==='city')city();else if(id==='detail')sim('🚘 DETAILING TYCOON',500);else if(id==='business')sim('💼 WHATEVER: BUSINESS',25000);else if(id==='startup')sim('📈 STARTUP OR DIE',10000);else if(id==='dealer')sim('🏎️ CAR DEALERSHIP TYCOON',30000);else if(id==='restaurant')sim('🍜 RESTAURANT TYCOON',5000);else if(id==='delivery')sim('🚚 DELIVERY BUSINESS',3000);else if(id==='survival')sim('🌲 SURVIVAL',1000);else if(id==='racing')sim('🏁 WHATEVER RACING',1000)}function simPage(){shell('<div class="head"><h2>Simulators</h2></div><div class="cards">'+G.filter(g=>['SIMULATION','BUSINESS','TYCOON','STRATEGY'].includes(g[2])).map(card).join('')+'</div>')}function projects(){shell('<div class="head"><h2>Projects</h2></div><div class="project">'+['Chaos Ladder — PLAYABLE','Detailing Tycoon — PLAYABLE','Whatever City — PLAYABLE','Multiverse Engine — IN DEVELOPMENT','Co-op Chaos — EXPERIMENTAL','New Worlds — COMING SOON'].map(x=>'<article class="panel"><h3>'+x+'</h3><p class="muted">WHATEVER project.</p></article>').join('')+'</div>')}function leader(){shell('<div class="head"><h2>Leaderboards</h2></div><section class="panel">'+[['1','PIXELPUNK','9820'],['2','MINTY','8940'],['3','VOIDCAT','8120'],['4','DUSTBYTE','7760'],['5','LOCAL PLAYER',''+(s.wins*100)]].map(x=>'<div class="leader"><b>#'+x[0]+'</b><span>'+x[1]+'</span><span>'+x[2]+'</span></div>').join('')+'<p class="muted">Seeded fictional rankings + local score. Not globally synchronized.</p></section>')}function ach(){shell('<div class="head"><h2>Achievements</h2></div><div class="ach">'+['CHAOS SURVIVOR','NOOB DESTROYER','CITY EXPLORER','TYCOON','100 GAMES'].map(x=>'<article class="panel"><h3>🔒 '+x+'</h3><p class="muted">Keep playing to unlock.</p></article>').join('')+'</div>')}window.play=play;window.gamesPage=gamesPage;window.home=home;window.city=city;window.simPage=simPage;window.projects=projects;window.leader=leader;window.ach=ach;home();sync();setInterval(save,10000)})()</script></body></html>
