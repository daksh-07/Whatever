<style>

r-spacing:.14em;color:#b6a4ff;font-size:12px}.hero h1{font-size:clamp(52px,10vw,110px);line-height:.88;letter-spacing:-6px;margin:12px 0 18px}.hero p{font-size:clamp(18px,2.5vw,25px);color:#c8c8d3;margin:0 0 25px;max-width:700px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#171720;color:white;border-radius:13px;padding:12px 17px;font-weight:800}.btn.primary{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border-color:#a78bfa66}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.section{margin-top:34px}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:14px}.sectionHead h2{margin:0;font-size:25px;letter-spacing:-.7px}.sectionHead span{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.gameCard{border:1px solid var(--line);background:linear-gradient(160deg,#13131b,#0e0e14);border-radius:19px;padding:15px;min-height:220px;display:flex;flex-direction:column;transition:.18s;position:relative;overflow:hidden}.gameCard:hover{transform:translateY(-4px);border-color:#ffffff25;box-shadow:0 15px 40px #0008}.thumb{height:105px;border-radius:13px;margin-bottom:12px;display:flex;align-items:end;padding:12px;font-size:22px;font-weight:950;letter-spacing:-1px;background:linear-gradient(135deg,#27213d,#12131c)}.thumb.arcade{background:linear-gradient(135deg,#24112e,#111827)}.thumb.biz{background:linear-gradient(135deg,#172b23,#101b17)}.thumb.city{background:linear-gradient(135deg,#17243b,#101017)}.thumb.hard{background:linear-gradient(135deg,#35151d,#141116)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.gameCard h3{margin:4px 0 4px;font-size:17px}.gameCard p{margin:0 0 11px;color:var(--muted);font-size:12px;flex:1}.cardBtn{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:#1a1a24;color:white;font-weight:800}.lock{opacity:.62}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.filter{border:1px solid var(--line);background:#111119;color:#aaaabd;border-radius:999px;padding:8px 12px}.filter.active{background:#8b5cf622;color:#d9d0ff;border-color:#8b5cf666}.panel{border:1px solid var(--line);background:#101017;border-radius:22px;padding:20px}.dashboard{display:grid;grid-template-columns:1fr 320px;gap:15px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}.stat{background:#171720;border:1px solid var(--line);padding:12px;border-radius:13px}.stat small{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.08em}.stat strong{display:block;font-size:21px;margin-top:2px}.bar{height:8px;background:#252531;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));width:0}.gameScreen{background:#09090e;border:1px solid var(--line);border-radius:20px;min-height:500px;padding:18px;position:relative;overflow:hidden}.gameTop{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.gameTitle{font-size:25px;font-weight:950;letter-spacing:-1px}.gameSub{color:var(--muted);font-size:12px}.choiceGrid{display:grid;gap:9px}.choice{background:#161620;border:1px solid #292936;color:white;padding:13px;border-radius:12px;text-align:left}.choice:hover{border-color:#8b5cf688;background:#1b1825}.feed{display:grid;gap:8px;max-height:350px;overflow:auto}.feedItem{padding:10px;border-radius:10px;background:#0d0d13;border:1px solid #22222c;font-size:12px}.good{border-left:3px solid var(--good)}.bad{border-left:3px solid var(--bad)}.muted{color:var(--muted)}.board{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-width:720px;margin:auto}.cell{aspect-ratio:1;border-radius:7px;background:#161620;border:1px solid #272733;display:flex;align-items:center;justify-content:center;font-size:10px;position:relative}.token{position:absolute;width:15px;height:15px;border-radius:50%;border:2px solid white;box-shadow:0 2px 6px #000}.ladder{background:#173a2b}.trap{background:#3a1b25}.canvas{position:relative;height:400px;background:linear-gradient(#111827,#0a0f17);border:1px solid var(--line);border-radius:16px;overflow:hidden}.player{position:absolute;background:#f5f5f5;border-radius:7px;width:26px;height:34px;box-shadow:0 0 20px #fff6}.platform{position:absolute;height:13px;background:#8b5cf6;border-radius:7px}.hazard{position:absolute;background:#fb7185;border-radius:5px}.finish{position:absolute;background:#34d399;border-radius:7px}.touch{display:flex;gap:8px;justify-content:center;margin-top:10px}.touch button{width:64px;height:52px;border-radius:13px;border:1px solid var(--line);background:#171720;color:white;font-size:20px}.city{height:470px;background:#101820;border-radius:17px;border:1px solid var(--line);position:relative;overflow:hidden}.city .road{position:absolute;background:#252934}.city .building{position:absolute;background:#1a2630;border:1px solid #31404c;border-radius:5px}.city .npc{position:absolute;width:12px;height:12px;background:#fbbf24;border-radius:50%}.city .car{position:absolute;width:22px;height:12px;background:#22d3ee;border-radius:5px}.you{position:absolute;width:15px;height:15px;background:#a78bfa;border-radius:50%;z-index:3;box-shadow:0 0 18px #a78bfa}.detailFlow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.step{padding:12px;border-radius:12px;background:#161620;border:1px solid var(--line);text-align:center;font-size:12px}.step.done{border-color:#34d39966;background:#10241b}.shopGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.shop{padding:14px;border:1px solid var(--line);border-radius:14px;background:#14141d}.profileGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.leaderRow{display:grid;grid-template-columns:40px 1fr 90px 60px;gap:8px;padding:10px;border-bottom:1px solid #20202a;align-items:center}.achievementGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.achievement{padding:14px;border:1px solid var(--line);border-radius:14px;background:#13131b}.achievement.unlocked{border-color:#fbbf2466}.projectGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.footer{margin-top:60px;border-top:1px solid #ffffff10;padding:28px 0;color:var(--muted);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.footer strong{color:white}.toast{position:fixed;right:18px;bottom:18px;z-index:100;background:#171720;border:1px solid #ffffff22;box-shadow:var(--shadow);padding:13px 16px;border-radius:13px;max-width:320px}.mobile-menu{display:none}.search{width:100%;max-width:360px;background:#101017;border:1px solid var(--line);color:white;border-radius:12px;padding:10px}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.miniMap{height:180px;border-radius:14px;background:#111922;border:1px solid var(--line);position:relative;overflow:hidden}.route{position:absolute;height:4px;background:#22d3ee;transform-origin:left center}.raceTrack{height:380px;border-radius:18px;background:repeating-linear-gradient(90deg,#25252b 0 55px,#303038 55px 110px);position:relative;overflow:hidden;border:1px solid var(--line)}.lane{position:absolute;top:0;bottom:0;width:2px;background:#fff4;border-left:2px dashed #fff5}.raceCar{position:absolute;width:36px;height:60px;border-radius:9px;background:#a78bfa;box-shadow:0 5px 20px #000;left:45%;bottom:25px}.opponent{position:absolute;width:34px;height:55px;border-radius:8px;background:#fb7185;top:30px}.finishLine{position:absolute;top:0;left:0;right:0;height:12px;background:repeating-linear-gradient(90deg,#fff 0 14px,#111 14px 28px)}@media(max-width:980px){.cards{grid-template-columns:repeat(2,1fr)}.dashboard{grid-template-columns:1fr}.projectGrid{grid-template-columns:1fr 1fr}}@media(max-width:700px){.links,.playerbar .levelpill{display:none}.menuBtn{display:block;margin-left:auto}.mobile-menu{position:absolute;top:62px;left:0;right:0;background:#09090f;border-bottom:1px solid var(--line);padding:10px 18px;flex-direction:column}.mobile-menu.open{display:flex}.hero{min-height:480px}.hero h1{letter-spacing:-3px}.cards{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,1fr)}.profileGrid,.two{grid-template-columns:1fr}.achievementGrid,.projectGrid{grid-template-columns:1fr}.detailFlow{grid-template-columns:1fr 1fr}.board{gap:2px}.cell{font-size:8px}.canvas{height:360px}.leaderRow{grid-template-columns:30px 1fr 70px 45px}}
</style></head>
<body><div class="app" id="app"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{
const A=document.getElementById('app'),toastEl=document.getElementById('toast');
const games=[
{id:'chaos',title:'CHAOS LADDER',cat:'ARCADE',diff:'CHAOTIC',time:'5–12 min',emoji:'🎲',type:'arcade',desc:'A 100-space board game where every roll can ruin your day.'},
{id:'rage',title:'WHY DID I DO THIS?',cat:'HARD',diff:'BRUTAL',time:'3–10 min',emoji:'💀',type:'hard',desc:'Original rage rooms with traps, checkpoints and questionable physics.'},
{id:'detail',title:'DETAILING TYCOON',cat:'SIMULATION',diff:'MEDIUM',time:'10–30 min',emoji:'🚘',type:'biz',desc:'Turn a bucket, vacuum and pressure washer into a detailing empire.'},
{id:'business',title:'WHATEVER: BUSINESS',cat:'BUSINESS',diff:'STRATEGY',time:'10–25 min',emoji:'💼',type:'biz',desc:'Run a business day by day. Keep cash alive. Chase momentum.'},
{id:'city',title:'WHATEVER CITY',cat:'OPEN WORLD',diff:'CHILL',time:'5–20 min',emoji:'🌆',type:'city',desc:'Explore an original mini city, take jobs and discover places.'},
{id:'startup',title:'STARTUP OR DIE',cat:'TYCOON',diff:'HARD',time:'10–20 min',emoji:'📈',type:'biz',desc:'MRR, churn, runway and the glorious possibility of going broke.'},
{id:'dealer',title:'CAR DEALERSHIP TYCOON',cat:'TYCOON',diff:'MEDIUM',time:'10–20 min',emoji:'🏎️',type:'biz',desc:'Buy, inspect, negotiate and flip fictional cars for profit.'},
{id:'restaurant',title:'RESTAURANT TYCOON',cat:'TYCOON',diff:'MEDIUM',time:'8–20 min',emoji:'🍜',type:'biz',desc:'Start with a food stall and build a restaurant brand.'},
{id:'delivery',title:'DELIVERY BUSINESS',cat:'STRATEGY',diff:'MEDIUM',time:'8–15 min',emoji:'🚚',type:'city',desc:'Manage fuel, drivers, routes and contracts.'},
{id:'survival',title:'SURVIVAL',cat:'SURVIVAL',diff:'HARD',time:'8–15 min',emoji:'🌲',type:'hard',desc:'Collect, craft and survive changing weather and nights.'},
{id:'racing',title:'WHATEVER RACING',cat:'RACING',diff:'FAST',time:'2–8 min',emoji:'🏁',type:'arcade',desc:'Arcade time trials with drifting, opponents and upgrades'}
];
const coming=[['CITY BUILDER','🏙️'],['CRYPTO TYCOON','₿'],['AIRLINE TYCOON','✈️'],['FARMING SIMULATOR','🌾'],['NIGHTCLUB TYCOON','🪩'],['SPACE COLONY','🚀'],['HOTEL TYCOON','🏨'],['CRIME INVESTIGATION','🔎'],['STREET RACING','🏁'],['ISLAND SURVIVAL','🏝️']];
const cats=['ALL','ACTION','ARCADE','PUZZLE','SIMULATION','BUSINESS','TYCOON','OPEN WORLD','STRATEGY','RACING','SURVIVAL','CASUAL','HARD','EXPERIMENTAL'];
let player=load();let current=null;let timer=null;
function load(){try{return Object.assign({name:'PLAYER',level:1,xp:0,coins:0,played:0,wins:0,time:0,best:{},ach:{},businessNetWorth:0},JSON.parse(localStorage.getItem('whatever-player')||'{}'))}catch{return {name:'PLAYER',level:1,xp:0,coins:0,played:0,wins:0,time:0,best:{},ach:{},businessNetWorth:0}}}
function save(){localStorage.setItem('whatever-player',JSON.stringify(player))}
function xp(n){player.xp+=n;player.coins+=Math.max(1,Math.round(n/4));let old=player.level;while(player.xp>=old*100){player.xp-=old*100;player.level++;}if(player.level>old)toast('LEVEL UP — Level '+player.level+' 🔥');save();}
function toast(t){toastEl.textContent=t;toastEl.classList.remove('hidden');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.add('hidden'),2800)}
function unlock(id,title,desc,reward=25){if(!player.ach[id]){player.ach[id]=true;xp(reward);toast('🏆 '+title+' — '+desc)}}
function nav(active='home'){return `<header class="nav"><div class="navin"><button class="logo" onclick="go('home')">WHATEVER<span>●</span></button><nav class="links">${[['home','HOME'],['games','GAMES'],['open','OPEN WORLD'],['sim','SIMULATORS'],['projects','PROJECTS'],['leader','LEADERBOARD'],['ach','ACHIEVEMENTS']].map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</nav><div class="playerbar"><span class="pill">🪙 ${player.coins}</span><span class="pill levelpill">LVL ${player.level}</span><button class="pill" onclick="go('profile')">${player.name}</button></div><button class="btn menuBtn" onclick="document.querySelector('.mobile-menu').classList.toggle('open')">☰</button></div><div class="mobile-menu">${[['home','HOME'],['games','GAMES'],['open','OPEN WORLD'],['sim','SIMULATORS'],['projects','PROJECTS'],['leader','LEADERBOARD'],['ach','ACHIEVEMENTS'],['profile','PROFILE']].map(x=>`<button onclick="go('${x[0]}');document.querySelector('.mobile-menu').classList.remove('open')">${x[1]}</button>`).join('')}</div></header>`}
function footer(){return `<footer class="footer"><div><strong>WHATEVER.</strong><br>Play. Build. Fail. Start again.</div><div>Games · Simulators · Open World · Projects · Leaderboard · Achievements · About · Contact<br><br>Made by Daksh<br>© 2026 Daksh. All rights reserved.</div></footer>`}
function shell(body){A.innerHTML=nav()+`<main class="page">${body}${footer()}</main>`}
function card(g){return `<article class="gameCard"><div class="thumb ${g.type}">${g.emoji} ${g.title}</div><div class="meta"><span>${g.cat}</span><span>${g.diff}</span></div><h3>${g.title}</h3><p>${g.desc}</p><button class="cardBtn" onclick="play('${g.id}')">PLAY →</button></article>`}
function home(){shell(`<section class="hero"><div class="heroContent"><div class="kicker">Browser Game Universe</div><h1>WHATEVER.</h1><p>One website. Hundreds of bad decisions.<br><span class="muted">Play. Build. Fail. Start again.</span></p><div class="actions"><button class="btn primary" onclick="go('games')">PLAY NOW →</button><button class="btn" onclick="go('games')">EXPLORE GAMES</button></div></div></section><section class="section"><div class="sectionHead"><h2>🔥 Featured Games</h2><span>Actual playable builds</span></div><div class="cards">${games.slice(0,4).map(card).join('')}</div></section><section class="section"><div class="sectionHead"><h2>⚡ Popular Right Now</h2><span>Local player stats</span></div><div class="cards">${games.slice(4,8).map(card).join('')}</div></section><section class="section"><div class="two"><div class="panel"><div class="kicker">Today's challenge</div><h2 id="dailyTitle">Loading…</h2><p id="dailyDesc" class="muted"></p><button class="btn primary" onclick="play('business')">TRY CHALLENGE →</button></div><div class="panel"><div class="kicker">Your progression</div><h2>Level ${player.level}</h2><p class="muted">${player.xp}/${player.level*100} XP · ${player.coins} Whatever Coins · ${player.wins} wins</p><div class="bar"><i style="width:${Math.min(100,player.xp/(player.level*100)*100)}%"></i></div><br><button class="btn" onclick="go('profile')">VIEW PROFILE</button></div></div></section><section class="section"><div class="sectionHead"><h2>🧪 More Worlds</h2><span>Locked for now</span></div><div class="cards">${coming.slice(0,4).map(x=>`<article class="gameCard lock"><div class="thumb hard">🔒 ${x[1]} ${x[0]}</div><div class="meta"><span>COMING SOON</span><span>LOCKED</span></div><h3>${x[0]}</h3><p>New game under construction.</p><button class="cardBtn" disabled>COMING SOON</button></article>`).join('')}</div></section>`);daily();}
function daily(){let d=new Date(),seed=Number(''+d.getFullYear()+(d.getMonth()+1)+d.getDate());let arr=[['NO LOANS','Make $100,000 without taking a loan.'],['SPEED RUN','Reach Day 10 in under 90 seconds.'],['REPUTATION KING','Finish with 85+ reputation.'],['BOOTSTRAP','Start small and finish profitable.'],['CHAOS SURVIVOR','Win a simulation after three bad events.']];let x=arr[seed%arr.length];let t=document.getElementById('dailyTitle');if(t){t.textContent=x[0];document.getElementById('dailyDesc').textContent=x[1]+' Reward: 100 XP + 50 Coins.'}}
function gamesPage(){shell(`<div class="sectionHead"><div><div class="kicker">Library</div><h2>All Games</h2></div><input class="search" id="search" placeholder="Search games…"></div><div class="filters" id="filters">${cats.map(c=>`<button class="filter ${c==='ALL'?'active':''}" onclick="filterGames('${c}',this)">${c}</button>`).join('')}</div><div class="cards" id="gameCards">${games.map(card).join('')}</div><section class="section"><div class="sectionHead"><h2>🔒 Coming Soon</h2><span>Locked until built</span></div><div class="cards">${coming.map(x=>`<article class="gameCard lock"><div class="thumb hard">🔒 ${x[1]} ${x[0]}</div><div class="meta"><span>COMING SOON</span><span>LOCKED</span></div><h3>${x[0]}</h3><p>Planned for a future WHATEVER release.</p><button class="cardBtn" disabled>COMING SOON</button></article>`).join('')}</div></section>`);document.getElementById('search').oninput=e=>filterGames('SEARCH',null,e.target.value)}
function filterGames(cat,el,query=''){document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');let q=query.toLowerCase();document.getElementById('gameCards').innerHTML=games.filter(g=>(cat==='ALL'||cat==='SEARCH'||g.cat===cat)&&(!q||g.title.toLowerCase().includes(q)||g.desc.toLowerCase().includes(q))).map(card).join('')||'<div class="panel">No games found.</div>'}
function gameWrap(title,sub,content,side=''){shell(`<div class="gameTop"><div><div class="gameTitle">${title}</div><div class="gameSub">${sub}</div></div><button class="btn" onclick="go('games')">← Library</button></div><div class="dashboard"><section class="gameScreen">${content}</section><aside class="panel">${side||'<div class="kicker">Player</div><h3>'+player.name+'</h3><p class="muted">Level '+player.level+' · '+player.coins+' coins</p><div class="bar"><i style="width:'+Math.min(100,player.xp/(player.level*100)*100)+'%"></i></div><br><button class="btn" onclick="go(\'profile\')">PROFILE</button>'}</aside></div>`)}
function play(id){clearInterval(timer);current=id;player.played++;save();if(id==='chaos')chaos();else if(id==='rage')rage();else if(id==='detail')detail();else if(id==='business')business();else if(id==='city')city();else if(id==='startup')startup();else if(id==='dealer')dealer();else if(id==='restaurant')restaurant();else if(id==='delivery')delivery();else if(id==='survival')survival();else if(id==='racing')racing();}
function chaos(){let pos=[0,0,0,0],turn=0;let events=['A marketing campaign went viral. Move +6.','Your rent increased. Move -4.','You found $500. Move +3.','An employee quit. Skip one turn.','Lucky break. Roll again.'];gameWrap('🎲 CHAOS LADDER','1 player vs chaos · 100 spaces',`<div class="board" id="board"></div><div class="actions" style="justify-content:center;margin-top:15px"><button class="btn primary" id="roll">ROLL DICE 🎲</button><button class="btn" id="chaosReset">RESTART</button></div><div id="chaosMsg" class="panel" style="margin-top:12px">Reach space 100. The board is not your friend.</div>`);drawBoard();document.getElementById('roll').onclick=()=>{let r=1+Math.floor(Math.random()*6);pos[0]+=r;if(pos[0]>100)pos[0]=100;let msg='Rolled '+r+'. '+events[Math.floor(Math.random()*events.length)];if(Math.random()<.25){pos[0]=Math.max(0,pos[0]-4);msg+=' Trap! You slide back 4.'}if(Math.random()<.18)pos[0]=Math.min(100,pos[0]+5);drawBoard();document.getElementById('chaosMsg').textContent='Space '+pos[0]+' — '+msg;if(pos[0]>=100){xp(100);player.wins++;unlock('chaos','CHAOS SURVIVOR','You reached space 100.',40);document.getElementById('roll').disabled=true;document.getElementById('chaosMsg').textContent='🏆 YOU WIN. Chaos has been defeated. Score: '+(pos[0]*10)}};document.getElementById('chaosReset').onclick=()=>chaos();function drawBoard(){let b=document.getElementById('board');b.innerHTML='';for(let n=100;n>=1;n--){let d=document.createElement('div');d.className='cell '+(n%13===0?'trap':'')+(n%17===0?' ladder':'');d.textContent=n;if(n===pos[0]){let t=document.createElement('i');t.className='token';d.appendChild(t)}b.appendChild(d)}}}
function rage(){let room=0,deaths=0,x=30,y=300,vx=0,vy=0,left=false,right=false,jump=false,playing=true;const levels=[{p:[[0,340,700],[110,285,110],[270,230,90],[410,175,90],[560,115,120]],h:[[205,325,45,15],[360,215,50,15]],f:[650,70]},{p:[[0,340,150],[200,290,100],[360,240,90],[510,190,80],[620,130,80]],h:[[155,325,40,15],[300,275,45,15],[470,175,45,15]],f:[665,85]},{p:[[0,340,120],[165,300,100],[310,260,80],[450,210,80],[580,150,110]],h:[[120,325,45,15],[260,245,45,15],[425,195,45,15],[550,135,35,15]],f:[665,105]}];gameWrap('💀 WHY DID I DO THIS?','Original rage platformer · room '+(room+1)+'/3',`<div class="canvas" id="rageCanvas"></div><div class="touch"><button id="l">◀</button><button id="j">▲</button><button id="r">▶</button></div><div class="actions" style="margin-top:10px"><button class="btn" id="rageRestart">RESTART ROOM</button><span class="pill" id="death">Deaths: 0</span></div>`);let c=document.getElementById('rageCanvas');function render(){c.innerHTML='';let L=levels[room];L.p.forEach(a=>{let e=document.createElement('div');e.className='platform';e.style=`left:${a[0]}px;top:${a[1]}px;width:${a[2]}px`;c.appendChild(e)});L.h.forEach(a=>{let e=document.createElement('div');e.className='hazard';e.style=`left:${a[0]}px;top:${a[1]}px;width:${a[2]}px;height:${a[3]}px`;c.appendChild(e)});let f=document.createElement('div');f.className='finish';f.style=`left:${L.f[0]}px;top:${L.f[1]}px;width:35px;height:35px`;c.appendChild(f);let p=document.createElement('div');p.className='player';p.style=`left:${x}px;top:${y}px`;c.appendChild(p)}function reset(){x=30;y=300;vx=vy=0;render()}function die(){deaths++;document.getElementById('death').textContent='Deaths: '+deaths;toast(['Skill issue detected.','Gravity wins again.','That was definitely your fault.'][deaths%3]);reset()}function tick(){if(!playing)return;vx=(left?-3:0)+(right?3:0);vy+=.6;x+=vx;y+=vy;let on=false;for(let p of levels[room].p){if(x+24>p[0]&&x<p[0]+p[2]&&y+34>=p[1]&&y+34<=p[1]+16&&vy>=0){y=p[1]-34;vy=0;on=true}}for(let h of levels[room].h){if(x+22>h[0]&&x<h[0]+h[2]&&y+30>h[1]&&y<h[1]+h[3])die()}if(y>390||x<0||x>690)die();let L=levels[room];if(x+20>L.f[0]&&x<L.f[0]+35&&y<L.f[1]+35){room++;if(room>=levels.length){playing=false;xp(90);player.wins++;unlock('rage','NOOB DESTROYER','You survived the rage rooms.',35);c.innerHTML='<div class="panel"><h2>🏆 YOU SURVIVED</h2><p>Three rooms. '+deaths+' deaths. Somehow you made it.</p><button class="btn primary" onclick="play(\'rage\')">PLAY AGAIN</button></div>';return}x=30;y=300;toast('Checkpoint reached. Room '+(room+1));}render()}setInterval(tick,30);function key(e,d){if(e.key==='ArrowLeft'||e.key==='a')left=d;if(e.key==='ArrowRight'||e.key==='d')right=d;if((e.key==='ArrowUp'||e.key==='w'||e.key===' ')&&d&&y>250)vy=-11}window.onkeydown=e=>key(e,true);window.onkeyup=e=>key(e,false);document.getElementById('l').onpointerdown=()=>left=true;document.getElementById('l').onpointerup=()=>left=false;document.getElementById('r').onpointerdown=()=>right=true;document.getElementById('r').onpointerup=()=>right=false;document.getElementById('j').onclick=()=>{if(y>250)vy=-11};document.getElementById('rageRestart').onclick=reset;render()}
function detail(){let cash=500,job=0,rep=55,steps=['FOAM','RINSE','CONTACT WASH','DRY'];let jobs=[['Basic Wash',90,25,4],['Interior Clean',150,45,5],['Full Detail',280,80,7],['Paint Decontamination',360,100,8],['Machine Polishing',520,150,10],['Paint Correction',750,220,13],['Headlight Restoration',420,90,8],['Ceramic Coating',1100,300,16],['Boat Detailing',1800,550,20],['Commercial Vehicles',1500,400,18]];gameWrap('🚘 DETAILING TYCOON','Start with $500 · build the workshop',`<div class="statgrid"><div class="stat"><small>Cash</small><strong id="dcash">$500</strong></div><div class="stat"><small>Reputation</small><strong id="drep">55</strong></div><div class="stat"><small>Jobs</small><strong id="djobs">0</strong></div><div class="stat"><small>Workshop</small><strong id="dshop">GARAGE</strong></div></div><div class="panel"><div class="kicker">Job board</div><div class="shopGrid" id="jobs"></div></div><div class="panel" style="margin-top:12px"><div class="kicker">Current job workflow</div><div class="detailFlow" id="flow">${steps.map(x=>`<div class="step">${x}</div>`).join('')}</div><p id="dmsg" class="muted">Pick a job to start.</p></div>`);let jbox=document.getElementById('jobs');jobs.forEach((j,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<b>'+j[0]+'</b><span>Revenue $'+j[1]+' · Cost $'+j[2]+' · Time '+j[3]+'m</span>';b.onclick=()=>doJob(i);jbox.appendChild(b)});function update(){document.getElementById('dcash').textContent='$'+Math.round(cash).toLocaleString();document.getElementById('drep').textContent=rep;document.getElementById('djobs').textContent=job;document.getElementById('dshop').textContent=job>=20?'PREMIUM DETAILING CENTRE':job>=10?'PROFESSIONAL STUDIO':'GARAGE'}function doJob(i){let j=jobs[i];if(cash<j[2])return toast('Not enough cash for the products.');cash+=j[1]-j[2];job++;rep=Math.min(100,rep+(Math.random()>.2?2:-3));let f=document.querySelectorAll('.step');f.forEach(x=>x.classList.remove('done'));f.forEach((x,k)=>set function survival(){let hp=100,energy=100,day=1,wood=0,stone=0,food=3;gameWrap('🌲 SURVIVAL','Collect. Craft. Survive the night.',`<div class="statgrid"><div class="stat"><small>Health</small><strong id="vhp"></strong></div><div class="stat"><small>Energy</small><strong id="ven"></strong></div><div class="stat"><small>Day</small><strong id="vday"></strong></div><div class="stat"><small>Resources</small><strong id="vres"></strong></div></div><div class="choiceGrid"><button class="choice" onclick="window.__sur('wood')"><b>🪵 Collect wood</b><span>+3 wood · -15 energy</span></button><button class="choice" onclick="window.__sur('stone')"><b>🪨 Collect stone</b><span>+2 stone · -18 energy</span></button><button class="choice" onclick="window.__sur('food')"><b>🍎 Hunt / forage</b><span>+2 food · -20 energy</span></button><button class="choice" onclick="window.__sur('craft')"><b>🛠️ Craft shelter</b><span>5 wood + 3 stone · restores safety</span></button><button class="choice" onclick="window.__sur('night')"><b>🌙 End day</b><span>Consume food. Face weather.</span></button></div><div id="vmsg" class="result"></div>`);function r(){document.getElementById('vhp').textContent=hp;document.getElementById('ven').textContent=energy;document.getElementById('vday').textContent=day;document.getElementById('vres').textContent=wood+'W / '+stone+'S / '+food+'F'}window.__sur=k=>{if(k==='wood'&&energy>=15){wood+=3;energy-=15}else if(k==='stone'&&energy>=18){stone+=2;energy-=18}else if(k==='food'&&energy>=20){food+=2;energy-=20}else if(k==='craft'&&wood>=5&&stone>=3){wood-=5;stone-=3;hp=Math.min(100,hp+15);document.getElementById('vmsg').textContent='Shelter crafted. The night is less terrifying.'}else if(k==='night'){if(food>0){food--;energy=100;day++;if(Math.random()<.25){hp-=10;document.getElementById('vmsg').textContent='A storm hit. Your shelter helped.'}else document.getElementById('vmsg').textContent='You made it through the night.'}}else return toast('You need more resources or energy.');if(hp<=0){document.getElementById('vmsg').textContent='💀 GAME OVER. The wilderness wins.';document.querySelectorAll('.choice').forEach(x=>x.disabled=true)}if(day>=10&&hp>0){xp(100);player.wins++;unlock('chaos','CHAOS SURVIVOR','Survive ten days.',40)}r()};r()}
function racing(){let pos=0,speed=0,done=false,opp=0;gameWrap('🏁 WHATEVER RACING','Original arcade time trial · fictional cars',`<div class="statgrid"><div class="stat"><small>Distance</small><strong id="rdist">0%</strong></div><div class="stat"><small>Speed</small><strong id="rspeed">0</strong></div><div class="stat"><small>Best</small><strong id="rbest">—</strong></div><div class="stat"><small>Upgrade</small><strong id="rup">LEVEL 1</strong></div></div><div class="raceTrack" id="track"><div class="finishLine"></div><div class="lane" style="left:25%"></div><div class="lane" style="left:50%"></div><div class="lane" style="left:75%"></div><div class="raceCar" id="rcar"></div><div class="opponent" id="opp"></div></div><div class="touch"><button id="gas">▲</button><button id="brake">▼</button><button id="leftR">◀</button><button id="rightR">▶</button></div><div class="actions" style="margin-top:10px"><button class="btn" id="raceRestart">RESTART</button><button class="btn" id="upgrade">UPGRADE 50🪙</button></div>`);let left=false,right=false;function tick(){if(done)return;speed=Math.max(0,Math.min(100,speed+(document.getElementById('gas').dataset.down==='1'?3:-1)));pos+=speed/850;opp+=.06+Math.random()*.08;document.getElementById('rdist').textContent=Math.min(100,Math.round(pos*100))+'%';document.getElementById('rspeed').textContent=Math.round(speed);let car=document.getElementById('rcar');let x=45+(left?-12:0)+(right?12:0);car.style.left=x+'%';document.getElementById('opp').style.top=(opp%1*340+30)+'px';if(pos>=1){done=true;let t=Math.round(1000/(speed||1)*100);player.best.racing=Math.max(player.best.racing||0,t);xp(70);player.wins++;unlock('speeddemon','SPEED DEMON','Win a racing time trial.',35);document.getElementById('rbest').textContent=t+' pts';toast('🏁 FINISH! Score '+t)}}timer=setInterval(tick,60);document.getElementById('gas').onpointerdown=()=>document.getElementById('gas').dataset.down='1';document.getElementById('gas').onpointerup=()=>document.getElementById('gas').dataset.down='0';document.getElementById('gas').onpointerleave=()=>document.getElementById('gas').dataset.down='0';document.getElementById('raceRestart').onclick=()=>racing();document.getElementById('upgrade').onclick=()=>{if(player.coins>=50){player.coins-=50;save();document.getElementById('rup').textContent='LEVEL 2';toast('Car upgraded.')}}document.getElementById('leftR').onpointerdown=()=>left=true;document.getElementById('leftR').onpointerup=()=>left=false;document.getElementById('rightR').onpointerdown=()=>right=true;document.getElementById('rightR').onpointerup=()=>right=false}
function city(){let x=48,y=58,money=250,job=0;gameWrap('🌆 WHATEVER CITY','Original top-down mini city · explore and earn',`<div class="city" id="world"><div class="road" style="left:0;right:0;top:45%;height:65px"></div><div class="road" style="top:0;bottom:0;left:45%;width:65px"></div>${[[5,8,30,22],[60,8,30,22],[5,70,30,22],[60,70,30,22],[72,35,20,17]].map(a=>`<div class="building" style="left:${a[0]}%;top:${a[1]}%;width:${a[2]}%;height:${a[3]}%"></div>`).join('')}<div class="npc" style="left:25%;top:45%"></div><div class="npc" style="left:70%;top:55%"></div><div class="car" style="left:52%;top:44%"></div><div class="you" id="you"></div></div><div class="touch"><button id="cu">▲</button><button id="cl">◀</button><button id="cd">▼</button><button id="cr">▶</button></div><div class="panel" style="margin-top:10px"><b>Locations</b><p class="muted">CITY CENTRE · INDUSTRIAL AREA · SUBURBS · BEACH · SHOPPING DISTRICT · BUSINESS DISTRICT · PORT · AIRPORT</p><button class="btn primary" id="jobcity">Accept a city job +$100</button><span class="pill" id="cmoney">$250</span></div>`);function render(){document.getElementById('you').style.left=x+'%';document.getElementById('you').style.top=y+'%'}function move(dx,dy){x=Math.max(2,Math.min(96,x+dx));y=Math.max(2,Math.min(94,y+dy));render();if(x>70&&y>70)toast('🏖️ Countryside edge discovered.')}['cu','cl','cd','cr'].forEach((id,i)=>document.getElementById(id).onclick=()=>{let d=[[0,-3],[-3,0],[0,3],[3,0]][i];move(...d)});window.onkeydown=e=>{if(e.key==='ArrowUp')move(0,-2);if(e.key==='ArrowDown')move(0,2);if(e.key==='ArrowLeft')move(-2,0);if(e.key==='ArrowRight')move(2,0)};document.getElementById('jobcity').onclick=()=>{money+=100;job++;xp(8);document.getElementById('cmoney').textContent='$'+money;if(job===5)unlock('explorer','CITY EXPLORER','Complete five city jobs.',30);toast('Job complete. +$100')};render()}
function projects(){shell(`<div class="sectionHead"><div><div class="kicker">Studio</div><h2>Projects</h2></div><span>Playable builds and experiments</span></div><div class="projectGrid">${[['Chaos Ladder','PLAYABLE','94%','chaos'],['Detailing Tycoon','PLAYABLE','82%','detail'],['Whatever City','PLAYABLE','68%','city'],['Racing','PLAYABLE','61%','racing'],['Multiverse Engine','IN DEVELOPMENT','31%'],['Co-op Chaos','EXPERIMENTAL','14%']].map(p=>`<article class="panel"><div class="kicker">${p[1]}</div><h3>${p[0]}</h3><p class="muted">Build progress ${p[2]}</p>${p[3]?`<button class="btn primary" onclick="play('${p[3]}')">PLAY →</button>`:'<button class="btn" disabled>LOCKED</button>'}</article>`).join('')}</div>`)}
function profile(){shell(`<div class="profileGrid"><section class="panel"><div class="kicker">Player profile</div><h1>${player.name}</h1><p class="muted">Level ${player.level} · ${player.xp}/${player.level*100} XP</p><div class="bar"><i style="width:${Math.min(100,player.xp/(player.level*100)*100)}%"></i></div><div class="statgrid" style="margin-top:15px"><div class="stat"><small>Games Played</small><strong>${player.played}</strong></div><div class="stat"><small>Wins</small><strong>${player.wins}</strong></div><div class="stat"><small>Coins</small><strong>${player.coins}</strong></div><div class="stat"><small>Best Score</small><strong>${Object.values(player.best).length?Math.max(...Object.values(player.best)):'—'}</strong></div></div><button class="btn" onclick="renamePlayer()">CHANGE PLAYER NAME</button></section><section class="panel"><div class="kicker">Business record</div><h2>$${Math.round(player.businessNetWorth||0).toLocaleString()}</h2><p class="muted">Highest business simulation score / net worth.</p><button class="btn primary" onclick="play('business')">RUN A BUSINESS</button></section></div>`)}
function renamePlayer(){let n=prompt('Player name',player.name);if(n){player.name=n.slice(0,18);save();profile()}}
function leader(){let rows=[['1','PIXELPUNK','9,820','42'],['2','MINTY','8,940','38'],['3','VOIDCAT','8,120','35'],['4','DUSTBYTE','7,760','31'],['5',player.name,(player.businessNetWorth||0).toLocaleString(),' '+player.level]];shell(`<div class="sectionHead"><div><div class="kicker">Scores</div><h2>Leaderboards</h2></div><span>Seeded fictional rankings + your local scores</span></div><div class="panel"><div class="filters"><button class="filter active">GLOBAL</button><button class="filter">WEEKLY</button><button class="filter">DAILY</button><button class="filter">PER GAME</button></div>${rows.map(r=>`<div class="leaderRow"><b>#${r[0]}</b><span>${r[1]}</span><span>${r[2]}</span><span>LVL ${r[3]}</span></div>`).join('')}<p class="muted" style="margin-top:14px">These rankings are local/seeded for the MVP. They are not globally synchronized across users.</p></div>`)}
function achievements(){let list=[['first','FIRST MILLION','Reach $1,000,000 in a business run.',50],['firstbiz','FIRST BUSINESS','Start your first business simulation.',20],['100games','100 GAMES','Play 100 games.',100],['perfectdetail','PERFECT DETAIL','Complete 10 detailing jobs.',45],['speeddemon','SPEED DEMON','Win a racing time trial.',35],['chaos','CHAOS SURVIVOR','Survive a chaos/survival milestone.',40],['tycoon','TYCOON','Build a serious detailing operation.',70],['noob','NOOB DESTROYER','Survive the rage rooms.',35],['moneyprinter','MONEY PRINTER','Finish a 30-day business run.',60],['startup','STARTUP SURVIVOR','Survive the startup cycle.',60],['dealer','FLIP MASTER','Sell 10 fictional cars.',45],['explorer','CITY EXPLORER','Complete five city jobs.',30]];shell(`<div class="sectionHead"><div><div class="kicker">Milestones</div><h2>Achievements</h2></div><span>${Object.keys(player.ach).length}/${list.length} unlocked</span></div><div class="achievementGrid">${list.map(a=>`<article class="achievement ${player.ach[a[0]]?'unlocked':''}"><div style="font-size:24px">${player.ach[a[0]]?'🏆':'🔒'}</div><h3>${a[1]}</h3><p class="muted">${a[2]}</p><small>Reward: ${a[3]} XP + ${Math.max(1,Math.round(a[3]/4))} coins</small></article>`).join('')}</div>`)}
function go(p){clearInterval(timer);if(p==='home')home();else if(p==='games')gamesPage();else if(p==='open')play('city');else if(p==='sim')shell(`<div class="sectionHead"><div><div class="kicker">Simulation</div><h2>Simulators</h2></div></div><div class="cards">${games.filter(g=>['SIMULATION','BUSINESS','TYCOON','STRATEGY'].includes(g.cat)).map(card).join('')}</div>`);else if(p==='projects')projects();else if(p==='leader')leader();else if(p==='ach')achievements();else if(p==='profile')profile()}
window.go=go;window.play=play;window.filterGames=filterGames;window.renamePlayer=renamePlayer;home();
setInterval(()=>{player.time++;if(player.played>=100)unlock('100games','100 GAMES','Play 100 games.',100);if((player.businessNetWorth||0)>=1000000)unlock('first','FIRST MILLION','Reach $1,000,000 in a business run.',50);save()},10000);
})();
</script></body></html>
